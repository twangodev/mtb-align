[package]
name = "mtb-align"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Median threshold bitmap alignment for handheld HDR exposures"
repository = "https://github.com/twangodev/mtb-align"
readme = "README.md"
keywords = ["hdr", "alignment", "registration", "mtb", "exposure"]
categories = ["multimedia::images"]

[dependencies]
rayon = { version = "1.12.0", optional = true }

[features]
rayon = ["dep:rayon"]

[dev-dependencies]
image = "0.25.10"
proptest = "1.11.0"
